app = 'clawhost-api'
primary_region = 'lax'

[build]

[http_service]
  internal_port = 2222
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[deploy]
  strategy = 'immediate'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024