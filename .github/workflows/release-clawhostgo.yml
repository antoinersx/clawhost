name: Release ClawHostGo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to checkout (defaults to current branch)'
        required: false
  push:
    tags:
      - 'clawhostgo-v*'

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install
      - run: node -e "const fs=require('fs'),p=require('path');const t=p.resolve('node_modules/electron');if(!fs.existsSync(t)){fs.mkdirSync('node_modules',{recursive:true});fs.symlinkSync(p.resolve('../../node_modules/electron'),t,'junction')}"
        working-directory: apps/clawhostgo
      - run: bunx electron-forge make --platform darwin --arch arm64
        working-directory: apps/clawhostgo
      - run: bunx electron-forge make --platform darwin --arch x64
        working-directory: apps/clawhostgo
      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: apps/clawhostgo/out/make/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install
      - run: node -e "const fs=require('fs'),p=require('path');const t=p.resolve('node_modules/electron');if(!fs.existsSync(t)){fs.mkdirSync('node_modules',{recursive:true});fs.symlinkSync(p.resolve('../../node_modules/electron'),t,'junction')}"
        working-directory: apps/clawhostgo
      - run: bunx electron-forge make --platform win32 --arch x64
        working-directory: apps/clawhostgo
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: apps/clawhostgo/out/make/

  publish:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2
      - run: bun install
      - uses: actions/download-artifact@v4
        with:
          name: mac-artifacts
          path: apps/clawhostgo/out/make/
      - uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: apps/clawhostgo/out/make/
      - run: bun scripts/publish-r2.ts
        working-directory: apps/clawhostgo
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}