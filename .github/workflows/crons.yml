name: Cron Jobs

on:
    schedule:
        - cron: '0 0-19 * * *'
        - cron: '0 * * * *'

jobs:
    send-feature-emails:
        if: github.event.schedule == '0 0-19 * * *'
        runs-on: ubuntu-latest
        steps:
            - name: Send feature emails
              run: |
                  curl -s -X GET \
                    -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                    https://api.clawhost.cloud/cron/send-feature-emails

    generate-blog-post:
        if: github.event.schedule == '0 * * * *'
        runs-on: ubuntu-latest
        steps:
            - name: Generate blog post
              run: |
                  curl -s -X GET \
                    -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                    https://api.clawhost.cloud/cron/generate-blog-post

    cleanup-expired-otps:
        if: github.event.schedule == '0 * * * *'
        runs-on: ubuntu-latest
        steps:
            - name: Cleanup expired OTPs
              run: |
                  curl -s -X GET \
                    -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                    https://api.clawhost.cloud/cron/cleanup-expired-otps

    cleanup-stale-rate-limits:
        if: github.event.schedule == '0 * * * *'
        runs-on: ubuntu-latest
        steps:
            - name: Cleanup stale rate limits
              run: |
                  curl -s -X GET \
                    -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
                    https://api.clawhost.cloud/cron/cleanup-stale-rate-limits
